name: Bug report
description: Report a reproducible problem in the prototype.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include tokens, passwords, private collection archives or personal photos. For vulnerabilities, see SECURITY.md."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, Android version and app version or commit
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
